name: Add company
description: Add a company career page to the watch list on the dashboard.
title: "[Company] <Name>"
labels: ["company"]
body:
  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Microsoft
    validations:
      required: true
  - type: input
    id: careers
    attributes:
      label: Career page link
      description: Ideally a search link already filtered to your roles and location.
      placeholder: https://jobs.careers.microsoft.com/global/en/search?q=software%20engineer&lc=Hyderabad
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: Target teams, referral contact, etc.
